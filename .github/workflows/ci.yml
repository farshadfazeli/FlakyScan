name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore FlakyScan.sln

      - name: Build
        run: dotnet build FlakyScan.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/FlakyScan.Tests/FlakyScan.Tests.csproj --no-build --configuration Release
